name: Daily Mind Bites 2X Auto Post

on:
  schedule:
    # Slot 1: 11:30 AM IST (06:00 UTC) - Morning Learning Peak
    - cron: '0 6 * * *'
    # Slot 2: 08:30 PM IST (15:00 UTC) - Evening Prime Time Peak
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_mind_bites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Mind Bites Publisher
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python auto_mind_bites_publisher.py

      - name: Commit and Push State Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mind_bites_pool.json daily_post_tracker.json
          git commit -m "Auto-post Mind Bites visual note [skip ci]" || echo "No changes to commit"
          git push origin main
