name: Daily Mind Bites 2X Dynamic Auto Post

on:
  schedule:
    # Slot 1: 11:30 AM IST (06:00 UTC) - Morning Learning Peak
    - cron: '0 6 * * *'
    # Slot 2: 08:30 PM IST (15:00 UTC) - Evening Prime Time Peak
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_dynamic_mind_bites:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests Pillow numpy

      - name: Run Dynamic Mind Bites Publisher
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python auto_mind_bites_publisher.py

      - name: Commit and Push State Updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json daily_post_tracker.json
          git commit -m "Auto-post fresh trending Mind Bites note [skip ci]" || echo "No changes to commit"
          git push origin main
